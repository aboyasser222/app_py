<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كشف ورد النيل</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 { color: #006d77; }
    .container { max-width: 1000px; margin: 0 auto; }
    form { margin: 30px 0; }
    input[type=file] { margin: 15px; }
    .btn{
      padding: 12px 30px;
      font-size: 1.1rem;
      background: #006d77;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:hover { background: #005a63; }
    .result-area {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      margin-top: 40px;
    }
    .img-box {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      padding: 15px;
      max-width: 480px;
    }
    .img-box h3 { margin: 10px 0; color: #444; }
    img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
    .msg {
      font-size: 1.25rem;
      margin: 25px 0;
      padding: 15px;
      border-radius: 10px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .success { background: #e6fffa; color: #006d77; }
    .warning { background: #fff3cd; color: #856404; }
  </style>
</head>
<body>

<div class="container">
  <h1>كشف ورد النيل بالذكاء الاصطناعي</h1>

  <form method="post" enctype="multipart/form-data">
    <input type="file" name="file" accept="image/*" class="btn" required>
    <br><br>
    <button type="submit" class="btn">رفع وتحليل الصورة</button>
  </form>

  {% if message %}
    <div class="msg {% if 'اكتشاف' in message %}success{% else %}warning{% endif %}">
      {{ message | safe }}
    </div>
  {% endif %}

  {% if original or result %}
  <div class="result-area">

    {% if original %}
    <div class="img-box">
      <h3>الصورة الأصلية</h3>
      <img src="{{ url_for('uploaded_file', filename=original) }}" alt="original">
    </div>
    {% endif %}

    {% if result %}
    <div class="img-box">
      <h3>الصورة بعد التحديد</h3>
      <img src="{{ url_for('result_file', filename=result) }}" alt="result">
    </div>
    {% endif %}

  </div>
  {% endif %}
</div>

</body>
</html>
